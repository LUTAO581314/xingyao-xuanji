services:
  bairui:
    build:
      context: ./packages/opencode
      dockerfile: Dockerfile.bairui
      args:
        BAIRUI_VERSION: 1.18.31-bairui-brand.2
    image: bairui:1.18.31-bairui-brand.2
    init: true
    restart: unless-stopped
    ports:
      # Keep the service on this computer. Remove 127.0.0.1 only when an
      # authenticated network deployment is explicitly intended.
      - "127.0.0.1:13148:13148"
    environment:
      BAIRUI_NAME: "${BAIRUI_NAME:-星杳}"
      BAIRUI_PROMPT_DISABLED: "${BAIRUI_PROMPT_DISABLED:-false}"
      OPENCODE_SERVER_USERNAME: "${OPENCODE_SERVER_USERNAME:-opencode}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-}"
    volumes:
      - bairui-data:/var/lib/bairui/data
      - bairui-config:/var/lib/bairui/config
      - bairui-state:/var/lib/bairui/state
      - bairui-cache:/var/cache/bairui
      - "${BAIRUI_WORKSPACE:-./workspace}:/workspace"
    working_dir: /workspace

volumes:
  bairui-data:
  bairui-config:
  bairui-state:
  bairui-cache:
